[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-coding-cli"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.89.0",
    "attrs>=24.0",
    "click>=8.3.1",
    "ddgs>=9.11.4",
    "fastmcp>=3.2.0",
    "httpx>=0.28.1",
    "jsonschema>=4.20",
    "openai>=2.15.0",
    "platformdirs>=4.9.2",
    "prompt-toolkit>=3.0.52",
    "pydantic>=2.12.5",
    "python-dotenv>=1.2.1",
    "rich>=14.2.0",
    "setproctitle>=1.3.7",
    "textual>=8.2.4",
    "textual-serve>=1.1.3",
    "tiktoken>=0.12.0",
]

[project.scripts]
iter = "main:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["."]
include = ["*"]
exclude = [
    "tests*",
    "docs*",
    ".venv*",
    "venv*",
    "__pycache__*",
    "*.egg-info*",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.9",
]